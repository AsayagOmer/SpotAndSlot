spring.application.name=2026b.Omer.Asayag
# 8084 - because we're the groups on Wednesday
server.port=8084

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=trace

spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.4

# Enabling work with Swagger.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


#########
#profiles
#########
# use to initialize data on startup
spring.profiles.active=default,initDemos

# no initialize
#spring.profiles.active=default

# JPA / Postgres - dev + test: regenerate schema on every boot (Sprint 4 §19).
# For the production/submission configuration that keeps data across restarts
# (Sprint 4 §20), run with the "prod" profile: it uses ddl-auto=update and
# disables the demo seeding. See application-prod.properties.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# generic JDBC browser for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
