# Production / submission configuration (Sprint 4 §20).
# Activate with: ./gradlew bootRun --args="--spring.profiles.active=prod"
# (or SPRING_PROFILES_ACTIVE=prod). Requires a running PostgreSQL — the Spring
# Boot Docker Compose support starts the one in compose.yaml automatically.
#
# The schema is created/updated but NEVER dropped, so data persists across
# server restarts, and the demo seeding (initDemos) is not active.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# quieter logging for production
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=warn

# the H2 console has no place in production
spring.h2.console.enabled=false
