name: Spot&Slot CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  predictive-service:
    name: Predictive ML Service (Python / XGBoost)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./predictive-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: predictive-service/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run ML Service Unit Tests
        run: pytest -v

  client:
    name: Web & Mobile Clients (React / TypeScript / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Client Unit Tests (Vitest)
        run: npm test -- --run

  backend:
    name: Spring Boot Backend API (Java 25 / Testcontainers / Cucumber BDD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run JUnit & Cucumber BDD Integration Suite
        run: ./gradlew test --no-daemon
